schema_version: 1
pack_id: prodhardening.fullstack.production
name: Full-Stack Production Hardening Capability Pack
version: 1.0.0
status: stable
model_agnostic: true
description: >
  A vendor-neutral capability/skill set for taking full-stack applications from functional prototype to production-ready system.
principles:
  - Production is a system property, not a frontend/backend checkbox.
  - Capabilities are task-oriented and triggered by work to be done, not by document chapters.
  - Mandatory safety controls belong in tools, tests, policy-as-code, CI/CD, and approval gates, not only in model instructions.
  - Progressive disclosure keeps each capability concise while references and templates carry deeper detail.
capabilities:
  - id: prodhardening.orchestrator
    name: production-hardening-orchestrator
    layer: "00 Operating Model"
    path: capabilities/00-production-hardening-orchestrator/SKILL.md
    summary: "Classify full-stack requests, route to the right capabilities, and synthesize production-readiness decisions."
    triggers:
      - "production ready"
      - "hardening"
      - "launch checklist"
      - "review the stack"
      - "full-stack"
      - "ship"
      - "architecture audit"
      - "what am I missing"
      - "vibe coding"
      - "production reality"
