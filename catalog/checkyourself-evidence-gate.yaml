name: checkyourself-evidence-gate
title: Check Yourself Evidence Gate
repo: https://github.com/KyaniteLabs/checkyourself
sha: 9531280b8857e10530511da7345ac0c9fe4e841e
subdir: hermes-plugin
description: "Blocks kanban_complete until an operator-approved test command passed on the unchanged task workspace. Disclosure: the check runs that project command with your OS user's authority; it is not a sandbox."
maintainer: KyaniteLabs
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "0.2.0"
docs_url: https://github.com/KyaniteLabs/checkyourself/blob/9531280b8857e10530511da7345ac0c9fe4e841e/hermes-plugin/README.md
platforms: [linux]
known_issues:
  - "Linux only; macOS and Windows are not supported."
  - "Only the exact kanban_complete tool is gated, not prose answers, external board clients or kanban_request_review."
  - "Keep plugins.hook_callback_timeout above 15 seconds (default 30)."
  - "One private import (hermes_cli.kanban_db, read-only board lookup for orchestrator completions); the validator warns, and a break fails closed."
  - "Runs trusted project tests with OS-user authority; same-user processes can edit plugin state. Not a sandbox."
capabilities:
  provides_tools: [checkyourself_evidence_check]
  provides_hooks: [pre_tool_call]
  provides_middleware: []
  requires_env: []
