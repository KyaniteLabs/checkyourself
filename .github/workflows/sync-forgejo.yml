name: Sync Forgejo mirror

# GitHub is this repo's trunk; the Forgejo copy (KyaniteLabs/checkyourself) is a read-only
# mirror. After trunk CI passes on main, the shared workflow fast-forwards
# the mirror to that exact commit (fleet GIT-CI-STRATEGY-20261123). Off until
# the repo variable FORGEJO_SYNC_ACTIVE is 'true'; dry-run until a mirror
# token is set. See KyaniteLabs/.github docs/sync-forgejo.md.
on:
  workflow_run:
    workflows: ["Validate CheckYourself"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: sync-forgejo-main
  cancel-in-progress: false

jobs:
  sync:
    if: vars.FORGEJO_SYNC_ACTIVE == 'true' && github.event.workflow_run.conclusion == 'success'
    uses: KyaniteLabs/.github/.github/workflows/sync-forgejo.yml@a9070204d393afce800230b4eefc809569b45a4a # main 2026-11-23
    with:
      trunk: main
      trigger-workflow-id: 285390078
      trigger-workflow-name: "Validate CheckYourself"
      trigger-workflow-path: .github/workflows/validate.yml
      required-workflows: |
        285390078:.github/workflows/validate.yml
      forgejo-repository: KyaniteLabs/checkyourself
      downstream-workflow: none
      dry-run: true
      toolkit-ref: a9070204d393afce800230b4eefc809569b45a4a
    secrets: inherit
