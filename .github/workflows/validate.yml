name: Validate CheckYourself

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"

      - name: Validate public repository shape
        run: python tools/validate_public.py

      - name: Check committed whitespace
        run: |
          EMPTY_TREE="$(git hash-object -t tree /dev/null)"
          git diff --check "$EMPTY_TREE"..HEAD

      - name: Compile Python tools
        run: python -m py_compile tools/validate_public.py tools/checkyourself.py tests/test_checkyourself_cli.py

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Smoke-test agent CLI contracts
        run: |
          python tools/checkyourself.py describe --format json > /tmp/checkyourself-capabilities.json
          python tools/checkyourself.py validate --kind capabilities /tmp/checkyourself-capabilities.json
          python tools/checkyourself.py scan . --format json --no-write > /tmp/checkyourself-scan.json
          python tools/checkyourself.py validate --kind scan /tmp/checkyourself-scan.json
          python tools/checkyourself.py diagnostic . --format json --no-write > /tmp/checkyourself-diagnostic.json
          python tools/checkyourself.py validate --kind scan /tmp/checkyourself-diagnostic.json
          python tools/checkyourself.py scan . --deep --format json --no-write > /tmp/checkyourself-deep-scan.json
          python tools/checkyourself.py validate --kind scan /tmp/checkyourself-deep-scan.json
          python tools/checkyourself.py score --findings /tmp/checkyourself-scan.json --format json --no-history > /tmp/checkyourself-score.json
          python tools/checkyourself.py validate --kind score /tmp/checkyourself-score.json
          python tools/checkyourself.py backlog --findings /tmp/checkyourself-scan.json --format json > /tmp/checkyourself-backlog.json
          python tools/checkyourself.py validate --kind backlog /tmp/checkyourself-backlog.json
          python tools/checkyourself.py next --findings /tmp/checkyourself-scan.json --format json > /tmp/checkyourself-next.json
          python tools/checkyourself.py validate --kind next /tmp/checkyourself-next.json
          python tools/checkyourself.py coverage --emit --format json > /tmp/checkyourself-coverage.json
          python tools/checkyourself.py validate --kind coverage /tmp/checkyourself-coverage.json

      - name: Smoke-test MCP wrapper
        run: |
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
            printf '%s\n' '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"describe","arguments":{}}}'
          } | python tools/checkyourself.py mcp > /tmp/checkyourself-mcp.out
          python - <<'PY'
          import json
          lines = [json.loads(line) for line in open("/tmp/checkyourself-mcp.out", encoding="utf-8")]
          assert [line["id"] for line in lines] == [1, 2, 3]
          assert any(tool["name"] == "score" for tool in lines[1]["result"]["tools"])
          assert lines[2]["result"]["structuredContent"]["schema"] == "checkyourself-capabilities/1"
          PY

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: |
          gitleaks dir . --no-banner --redact --exit-code 1
