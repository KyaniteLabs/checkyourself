name: Validate CheckYourself

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate public repository shape
        run: python tools/validate_public.py

      - name: Check committed whitespace
        run: |
          EMPTY_TREE="$(git hash-object -t tree /dev/null)"
          git diff --check "$EMPTY_TREE"..HEAD

      - name: Compile Python tools
        run: python -m py_compile tools/validate_public.py tools/checkyourself.py

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Smoke-test the scan CLI
        run: python tools/checkyourself.py . --no-write --quiet

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: |
          gitleaks dir . --no-banner --redact --exit-code 1
