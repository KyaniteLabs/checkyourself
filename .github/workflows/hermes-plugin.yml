name: Hermes evidence gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install pytest==8.3.5
      - run: python tools/build_hermes_plugin.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: e76fbd80be65ea5c1b89831f8d7aaedb713f5cac
          path: .hermes-runtime
      - run: python -m pip install -e ./.hermes-runtime
      - name: Validate with real runtime
        run: hermes plugins validate hermes-plugin --json > validate.json
      - name: Native integration and timed demo
        env:
          CHECKYOURSELF_RUNTIME_TEST: "1"
          HERMES_HOME: ${{ runner.temp }}/checkyourself-hermes
        run: python -m unittest discover -s tests -p test_hermes_runtime.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hermes-validation
          path: validate.json
