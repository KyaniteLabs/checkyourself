name: Mutation
# Advisory weekly mutation score for the public-shape validator. This workflow
# is deliberately not a required pull-request check.
on:
  schedule:
    - cron: "19 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: mutation-score
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned mutation tools
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 mutmut==3.8.0
      - name: Measure the validator mutation score (advisory, 72% floor)
        run: |
          mutmut run
          mutmut export-cicd-stats
          python - <<'PY'
          import json
          from pathlib import Path

          stats = json.loads(Path("mutants/mutmut-cicd-stats.json").read_text())
          killed = stats["killed"]
          survived = stats["survived"]
          timeout = stats["timeout"]
          decided = killed + survived + timeout
          score = 100.0 * killed / decided if decided else 0.0
          print(
              f"gate evidence: mutation score {score:.1f}% of covered mutants "
              f"({killed} killed, {survived} survived, {timeout} timeout; "
              f"{stats.get('no_tests', 0)} no-coverage mutants out of scope)"
          )
          assert score >= 72.0, f"mutation score {score:.1f}% is below the 72% floor"
          PY
      - name: Retain mutation stats
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-stats
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: warn
          retention-days: 30
